services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MOYAMI_PORT:-4173}:4173"
    environment:
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:?set BOOTSTRAP_KEY in .env}
      SITE_NAME: ${SITE_NAME:-moyami}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SOURCE_OUTBOUND_PROXY: ${SOURCE_OUTBOUND_PROXY:-}
    volumes:
      - accounts:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0

volumes:
  accounts:
